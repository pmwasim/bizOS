packages:
  - apps/*
  - packages/*

autoInstallPeers: false
engineStrict: true
injectWorkspacePackages: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
preferWorkspacePackages: true
saveExact: true
strictPeerDependencies: true

overrides:
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=3.0.0 <3.0.6": "3.0.6"
  "brace-expansion@>=4.0.0 <4.0.1": "4.0.1"
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  "fast-uri": "^3.1.5"
  "find-my-way@<=9.6.0": "9.7.0"
  "js-yaml@>=3.0.0 <3.15.1": "3.15.1"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  # GHSA-2v37-7h3g-55p8: custom generators loop forever when size is zero.
  # Scoped to the 3.x line, which is what postcss pulls in; nanoid 4+ is ESM-only
  # and forcing it onto CJS consumers would repeat the brace-expansion breakage.
  "nanoid@<3.3.18": "3.3.18"
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts <8 stack exhaustion on recursive object graphs.
  # Transitive via prisma > @prisma/config; 8.x is the patched line.
  "deepmerge-ts@<8.0.0": "8.0.1"
  "postcss@<=8.5.17": "8.5.23"
  "sharp@<0.35.0": "0.35.0"
  "valibot@<=1.4.1": "1.4.2"

allowBuilds:
  "@prisma/engines": true
  argon2: true
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  prisma: true
  sharp: true

catalog:
  typescript: 6.0.3
  vitest: 4.1.10
  zod: 4.4.3

minimumReleaseAgeExclude:
  - "@next/env@16.2.12"
  - "@next/swc-darwin-arm64@16.2.12"
  - "@next/swc-darwin-x64@16.2.12"
  - "@next/swc-linux-arm64-gnu@16.2.12"
  - "@next/swc-linux-arm64-musl@16.2.12"
  - "@next/swc-linux-x64-gnu@16.2.12"
  - "@next/swc-linux-x64-musl@16.2.12"
  - "@next/swc-win32-arm64-msvc@16.2.12"
  - "@next/swc-win32-x64-msvc@16.2.12"
  - "@turbo/darwin-64@2.10.7"
  - "@turbo/darwin-arm64@2.10.7"
  - "@turbo/linux-64@2.10.7"
  - "@turbo/linux-arm64@2.10.7"
  - "@turbo/windows-64@2.10.7"
  - "@turbo/windows-arm64@2.10.7"
  - next@16.2.12
  - turbo@2.10.7
  - "@next/eslint-plugin-next@16.2.12"
  - fast-uri@3.1.5
  - brace-expansion@5.0.9
  - js-yaml@3.15.1
  - js-yaml@4.3.1
