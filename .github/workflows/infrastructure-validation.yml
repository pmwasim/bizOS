name: Infrastructure validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-token:
    name: Validate Cloudflare API token
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify token shape and zone access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const token = String(process.env.CLOUDFLARE_API_TOKEN ?? "").trim();
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID ?? "").trim();
          console.log(`token_present=${Boolean(token)}`);
          console.log(`account_id_present=${Boolean(accountId)}`);
          if (!token || !accountId) {
            console.error("Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID");
            process.exit(1);
          }
          const response = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
            headers: { authorization: `Bearer ${token}` },
          });
          const body = await response.json();
          console.log(`http_status=${response.status}`);
          console.log(`success=${body.success}`);
          if (!body.success) {
            const codes = (body.errors ?? []).map((error) => error.code).join(",");
            console.error(`verify_failed codes=${codes || "unknown"}`);
            process.exit(1);
          }
          console.log(`token_status=${body.result?.status ?? "unknown"}`);
          const zones = await fetch("https://api.cloudflare.com/client/v4/zones?name=qloudihub.com", {
            headers: { authorization: `Bearer ${token}` },
          });
          const zoneBody = await zones.json();
          console.log(`zone_query_success=${zoneBody.success}`);
          console.log(`zone_count=${zoneBody.result?.length ?? 0}`);
          if (!zoneBody.success || !zoneBody.result?.length) {
            console.error("qloudihub.com zone not accessible with this token");
            process.exit(1);
          }
          console.log("Cloudflare token and zone access validated");
          NODE

  r2-probe:
    name: Validate R2 put/get/delete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @bizo/storage...
      - name: Run R2 probe
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: pnpm --filter @bizo/storage validate:r2
