name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_INTERNAL_URL: http://localhost:3001/api/v1
      AUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-only-auth-secret-that-is-at-least-32-bytes
      DATABASE_URL: postgresql://bizo:ci-only@localhost:5432/bizo
      INTERNAL_AUTH_SECRET: ci-only-internal-auth-secret-at-least-32-bytes
      NEXT_TELEMETRY_DISABLED: "1"
      REDIS_PASSWORD: ci-only-redis-password
      REDIS_URL: redis://:ci-only-redis-password@127.0.0.1:6379
      RUN_DATABASE_TESTS: "true"
      RUN_REDIS_TESTS: "true"
      SMTP_FROM: quotes@example.test
      SMTP_URL: smtp://localhost:1025
      # The whole e2e suite drives the product from one source address, so it shares a single
      # throttle bucket that a real user never approaches. Widen it for the harness only; the API
      # refuses any value but 1 when NODE_ENV=production (see security/throttle-policy.ts).
      THROTTLE_SCALE: "40"
      TURBO_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bizo
          POSTGRES_PASSWORD: ci-only
          POSTGRES_USER: bizo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizo -d bizo" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start authenticated Redis and SMTP test services
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull redis:8-alpine && docker pull axllent/mailpit:v1.30.0; then
              break
            fi
            echo "Docker Hub pull failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          docker run --detach --name bizo-ci-redis \
            --publish 127.0.0.1:6379:6379 \
            redis:8-alpine redis-server --requirepass "$REDIS_PASSWORD"
          docker run --detach --name bizo-ci-mailpit \
            --publish 127.0.0.1:1025:1025 \
            --publish 127.0.0.1:8025:8025 \
            axllent/mailpit:v1.30.0
          for attempt in {1..30}; do
            if docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" bizo-ci-redis redis-cli ping \
              && curl --fail --silent http://127.0.0.1:8025/livez; then
              exit 0
            fi
            sleep 1
          done
          docker logs bizo-ci-redis
          docker logs bizo-ci-mailpit
          exit 1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm security:audit
      - name: Apply database migrations
        run: pnpm --filter @bizo/database prisma:migrate:deploy
      - name: Verify database migration status
        run: pnpm --filter @bizo/database exec prisma migrate status
      - name: Run foundation gate
        run: pnpm check
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop and mobile quotation journeys
        run: pnpm test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  notify-n8n:
    name: Notify n8n (optional)
    runs-on: ubuntu-24.04
    needs: quality
    if: failure()
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notify n8n of CI failure
        env:
          N8N_CI_WEBHOOK_URL: ${{ secrets.N8N_CI_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/ops/n8n-notify.mjs ci-failure --job "Quality gate"
        continue-on-error: true
