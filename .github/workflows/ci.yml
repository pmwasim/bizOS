name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://bizo:ci-only@localhost:5432/bizo
      INTERNAL_AUTH_SECRET: ci-only-internal-auth-secret-at-least-32-bytes
      NEXT_TELEMETRY_DISABLED: "1"
      RUN_DATABASE_TESTS: "true"
      SMTP_FROM: quotes@example.test
      SMTP_URL: smtp://localhost:1025
      TURBO_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bizo
          POSTGRES_PASSWORD: ci-only
          POSTGRES_USER: bizo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizo -d bizo" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm security:audit
      - name: Apply database migrations
        run: pnpm --filter @bizo/database prisma:migrate:deploy
      - name: Run foundation gate
        run: pnpm check
