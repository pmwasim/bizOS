name: Agent payment authz format

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-payment-authz-format.yml
      - docs/journal/2026-08-07-payment-state-transition-authorization.md

permissions:
  contents: write

concurrency:
  group: agent-payment-authz-format
  cancel-in-progress: true

jobs:
  format:
    # Temporary same-repository workflow; remove after the formatting commit lands.
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/payment-state-transition-authz'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/payment-state-transition-authz
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format journal
        run: pnpm exec prettier --write docs/journal/2026-08-07-payment-state-transition-authorization.md
      - name: Commit formatting
        run: |
          if git diff --quiet -- docs/journal/2026-08-07-payment-state-transition-authorization.md; then
            echo "Formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/journal/2026-08-07-payment-state-transition-authorization.md
          git commit -m "style(journal): apply repository formatting"
          git push origin HEAD:agent/payment-state-transition-authz
