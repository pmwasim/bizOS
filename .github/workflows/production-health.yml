name: Production health

on:
  schedule:
    # Every 30 minutes — free-tier cold starts may cause transient failures; investigate repeats.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    name: Probe web and API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check API health
        env:
          API_HEALTH_URL: https://api.bizos.qloudihub.com/api/v1/health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 45 "$API_HEALTH_URL" \
              | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "API healthy"
              exit 0
            fi
            echo "API probe attempt ${attempt} failed; retrying (free-tier wake)..."
            sleep $((attempt * 5))
          done
          echo "API health check failed after retries"
          exit 1
      - name: Check web origin
        env:
          WEB_HEALTH_URL: https://${{ vars.WEB_ORIGIN_HOST }}/
        run: |
          set -euo pipefail
          if [ -z "${WEB_HEALTH_URL#https://}" ] || [ "${WEB_HEALTH_URL}" = "https://" ]; then
            echo "WEB_ORIGIN_HOST is not configured in the production environment"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            code=$(curl --silent --max-time 45 --output /dev/null --write-out '%{http_code}' "$WEB_HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Web healthy"
              exit 0
            fi
            echo "Web probe attempt ${attempt} returned HTTP ${code}; retrying..."
            sleep $((attempt * 5))
          done
          echo "Web health check failed after retries"
          exit 1
      - name: Check public web edge (diagnostic)
        env:
          WEB_PUBLIC_URL: https://bizos.qloudihub.com/
          WEB_PUBLIC_PROXY_URL: https://r.jina.ai/http://bizos.qloudihub.com/
        run: |
          set -euo pipefail
          headers=$(mktemp)
          proxy_body=$(mktemp)
          trap 'rm -f "$headers" "$proxy_body"' EXIT
          code=$(curl --silent --max-time 45 --dump-header "$headers" --output /dev/null \
            --write-out '%{http_code}' "$WEB_PUBLIC_URL" || true)
          case "$code" in
            200)
              echo "Public web edge reachable"
              ;;
            403)
              if grep -Eiq '^x-render-origin-server:[[:space:]]*Render[[:space:]]*$' "$headers"; then
                echo "::warning::Public web edge denied this GitHub runner with HTTP 403 from Render; authoritative origin probe passed"
              elif proxy_code=$(curl --fail --silent --show-error --location --max-time 45 \
                --output "$proxy_body" --write-out '%{http_code}' "$WEB_PUBLIC_PROXY_URL" || true) \
                && [ "$proxy_code" = "200" ] \
                && grep -Eqi 'Title:[[:space:]]*bizOS|Business Operating System' "$proxy_body"; then
                echo "::warning::Public web edge denied this GitHub runner with HTTP 403; independent public proxy reached bizOS and authoritative origin probe passed"
              else
                echo "::error::Public web edge returned HTTP 403 and independent public verification failed"
                exit 1
              fi
              ;;
            *)
              echo "::error::Public web edge returned HTTP ${code:-0}"
              exit 1
              ;;
          esac

  notify-n8n:
    name: Notify n8n (optional)
    runs-on: ubuntu-24.04
    needs: probe
    if: failure()
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notify n8n of production health failure
        env:
          N8N_CI_WEBHOOK_URL: ${{ secrets.N8N_CI_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/ops/n8n-notify.mjs ci-failure --job "Production health"
        continue-on-error: true
