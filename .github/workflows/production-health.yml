name: Production health

on:
  schedule:
    # Every 30 minutes — free-tier cold starts may cause transient failures; investigate repeats.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    name: Probe web and API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check API health
        env:
          API_HEALTH_URL: https://api.bizos.qloudihub.com/api/v1/health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 45 "$API_HEALTH_URL" \
              | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "API healthy"
              exit 0
            fi
            echo "API probe attempt ${attempt} failed; retrying (free-tier wake)..."
            sleep $((attempt * 5))
          done
          echo "API health check failed after retries"
          exit 1
      - name: Check web origin
        env:
          WEB_HEALTH_URL: https://${{ vars.WEB_ORIGIN_HOST }}/
        run: |
          set -euo pipefail
          if [ -z "${WEB_HEALTH_URL#https://}" ] || [ "${WEB_HEALTH_URL}" = "https://" ]; then
            echo "WEB_ORIGIN_HOST is not configured in the production environment"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            code=$(curl --silent --max-time 45 --output /dev/null --write-out '%{http_code}' "$WEB_HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Web healthy"
              exit 0
            fi
            echo "Web probe attempt ${attempt} returned HTTP ${code}; retrying..."
            sleep $((attempt * 5))
          done
          echo "Web health check failed after retries"
          exit 1
      - name: Check public web edge (diagnostic)
        env:
          WEB_PUBLIC_URL: https://bizos.qloudihub.com/
        run: |
          set -euo pipefail
          code=$(curl --silent --max-time 45 --output /dev/null --write-out '%{http_code}' "$WEB_PUBLIC_URL" || true)
          case "$code" in
            200)
              echo "Public web edge reachable"
              ;;
            403)
              echo "::warning::Public web edge denied this GitHub runner with HTTP 403; authoritative origin probe passed"
              ;;
            *)
              echo "::error::Public web edge returned HTTP ${code:-0}"
              exit 1
              ;;
          esac
