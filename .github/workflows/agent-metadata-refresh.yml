name: Agent metadata refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-metadata-refresh.yml
      - apps/api/src/payments/**
      - packages/contracts/src/payments*
      - docs/journal/**
      - scripts/check-tracked-runtime-artifacts.mjs
      - package.json
      - pnpm-workspace.yaml

permissions:
  contents: write

concurrency:
  group: agent-metadata-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/harden-payment-boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-payment-boundary
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Refresh journal and repository graph
        run: |
          pnpm exec prettier --write docs/journal/2026-08-07-harden-payment-boundary-and-runtime-artifacts.md
          pnpm journal:index
          pnpm graph
      - name: Commit generated metadata
        run: |
          if git diff --quiet -- \
            .agent/graph.json \
            .agent/graph.md \
            docs/journal/README.md \
            docs/journal/2026-08-07-harden-payment-boundary-and-runtime-artifacts.md; then
            echo "Generated metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .agent/graph.json \
            .agent/graph.md \
            docs/journal/README.md \
            docs/journal/2026-08-07-harden-payment-boundary-and-runtime-artifacts.md
          git commit -m "docs(agent): refresh graph and journal index"
          git push origin HEAD:agent/harden-payment-boundary
