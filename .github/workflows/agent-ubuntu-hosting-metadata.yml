name: Agent Ubuntu hosting metadata refresh

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-ubuntu-hosting-metadata.yml
      - docs/operations/ubuntu-cutover-handoff.md
      - docs/decisions/**
      - docs/journal/**
      - .env.example

permissions:
  contents: write

concurrency:
  group: agent-ubuntu-hosting-metadata
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'ops/retire-render-production-path'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/retire-render-production-path
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format and refresh generated metadata
        run: |
          pnpm exec prettier --write \
            docs/operations/ubuntu-cutover-handoff.md \
            docs/decisions/README.md \
            docs/decisions/0022-ubuntu-production-hosting.md \
            docs/journal/2026-08-07-retire-render-production-path.md
          pnpm journal:index
          pnpm graph
      - name: Commit generated metadata
        run: |
          if git diff --quiet; then
            echo "Metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .agent/graph.json \
            .agent/graph.md \
            docs/operations/ubuntu-cutover-handoff.md \
            docs/decisions/README.md \
            docs/decisions/0022-ubuntu-production-hosting.md \
            docs/journal/README.md \
            docs/journal/2026-08-07-retire-render-production-path.md
          git commit -m "docs(agent): refresh Ubuntu hosting metadata"
          git push origin HEAD:ops/retire-render-production-path
