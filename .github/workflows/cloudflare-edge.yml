name: Cloudflare edge bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-edge:
    name: Configure DNS and edge controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Cloudflare DNS and security settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_ORIGIN_HOST: ${{ vars.WEB_ORIGIN_HOST }}
          API_ORIGIN_HOST: ${{ vars.API_ORIGIN_HOST }}
        run: node scripts/ops/configure-cloudflare-edge.mjs
