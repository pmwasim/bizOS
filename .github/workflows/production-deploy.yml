name: Production deploy

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Commit SHA to deploy (defaults to the workflow SHA)
        required: false
        type: string
      skip_migrate:
        description: Skip database migration (emergency only)
        required: false
        type: boolean
        default: false
      rollback_to_sha:
        description: Prior successful release SHA to roll back to (optional)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (fail before any mutation)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Rollback re-runs must also prove hosting credentials exist; the release
    # gate itself validates application code, not production reachability.
    steps:
      - name: Validate target SHA shape
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_to_sha }}
          REQUESTED_SHA: ${{ inputs.git_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$ROLLBACK_SHA" ]; then CANDIDATE="$ROLLBACK_SHA";
          elif [ -n "$REQUESTED_SHA" ]; then CANDIDATE="$REQUESTED_SHA";
          else CANDIDATE="$DEFAULT_SHA"; fi
          if ! [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deploy SHA must be a full 40-character lowercase git SHA (got '$CANDIDATE')."
            exit 1
          fi
      - name: Require hosting credentials before mutation
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
        run: |
          missing=""
          [ -z "$RENDER_API_KEY" ] && missing="$missing RENDER_API_KEY"
          [ -z "$RENDER_API_SERVICE_ID" ] && missing="$missing RENDER_API_SERVICE_ID"
          [ -z "$RENDER_WEB_SERVICE_ID" ] && missing="$missing RENDER_WEB_SERVICE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required production hosting secrets:$missing"
            echo "Refusing to publish images, migrate the database, or roll out hosting."
            echo "Configure the production environment secrets, then re-run."
            exit 1
          fi
          echo "Hosting credentials present; safe to proceed to mutation stages."
      - name: Require database credentials before mutation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKIP_MIGRATE: ${{ inputs.skip_migrate }}
          ROLLBACK_SHA: ${{ inputs.rollback_to_sha }}
        run: |
          if [ "$SKIP_MIGRATE" = "true" ] || [ -n "$ROLLBACK_SHA" ]; then
            echo "Migration skipped for this run; DATABASE_URL not required."
            exit 0
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured but a production migration would run."
            exit 1
          fi
          echo "DATABASE_URL present."
      - name: Record preflight summary
        env:
          DEPLOY_SHA: ${{ inputs.rollback_to_sha || inputs.git_sha || github.sha }}
          SKIP_MIGRATE: ${{ inputs.skip_migrate }}
          ROLLBACK_SHA: ${{ inputs.rollback_to_sha }}
        run: |
          {
            echo "## Production deploy preflight"
            echo "- Target SHA: \`${DEPLOY_SHA}\`"
            echo "- Mode: $( [ -n "$ROLLBACK_SHA" ] && echo rollback || echo deploy )"
            echo "- Migration: $( [ "$SKIP_MIGRATE" = "true" ] && echo skipped-by-input || echo enabled )"
            echo "- Hosting credentials: present"
            echo "- Database credentials: $( [ "$SKIP_MIGRATE" = "true" ] || [ -n "$ROLLBACK_SHA" ] && echo not-required || echo present )"
          } >> "$GITHUB_STEP_SUMMARY"

  release-gate:
    name: Release gate
    needs: [preflight]
    if: ${{ inputs.rollback_to_sha == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      API_INTERNAL_URL: http://localhost:3001/api/v1
      AUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-only-auth-secret-that-is-at-least-32-bytes
      DATABASE_URL: postgresql://bizo:ci-only@localhost:5432/bizo
      INTERNAL_AUTH_SECRET: ci-only-internal-auth-secret-at-least-32-bytes
      NEXT_TELEMETRY_DISABLED: "1"
      REDIS_PASSWORD: ci-only-redis-password
      REDIS_URL: redis://:ci-only-redis-password@127.0.0.1:6379
      RUN_DATABASE_TESTS: "true"
      RUN_REDIS_TESTS: "true"
      SMTP_FROM: quotes@example.test
      SMTP_URL: smtp://localhost:1025
      TURBO_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bizo
          POSTGRES_PASSWORD: ci-only
          POSTGRES_USER: bizo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizo -d bizo" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - name: Start authenticated Redis and SMTP test services
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull redis:8-alpine && docker pull axllent/mailpit:v1.30.0; then
              break
            fi
            echo "Docker Hub pull failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          docker run --detach --name bizo-ci-redis \
            --publish 127.0.0.1:6379:6379 \
            redis:8-alpine redis-server --requirepass "$REDIS_PASSWORD"
          docker run --detach --name bizo-ci-mailpit \
            --publish 127.0.0.1:1025:1025 \
            --publish 127.0.0.1:8025:8025 \
            axllent/mailpit:v1.30.0
          for attempt in {1..30}; do
            if docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" bizo-ci-redis redis-cli ping \
              && curl --fail --silent http://127.0.0.1:8025/livez; then
              exit 0
            fi
            sleep 1
          done
          docker logs bizo-ci-redis
          docker logs bizo-ci-mailpit
          exit 1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm security:audit
      - name: Apply database migrations
        run: pnpm --filter @bizo/database prisma:migrate:deploy
      - name: Verify database migration status
        run: pnpm --filter @bizo/database exec prisma migrate status
      - name: Run foundation gate
        run: pnpm check
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop and mobile quotation journeys
        run: pnpm test:e2e

  publish-images:
    name: Publish immutable images
    needs: [release-gate]
    if: ${{ always() && (needs.release-gate.result == 'success' || inputs.rollback_to_sha != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
    steps:
      - name: Resolve deploy SHA
        id: meta
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_to_sha }}
          REQUESTED_SHA: ${{ inputs.git_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$ROLLBACK_SHA" ]; then
            CANDIDATE="$ROLLBACK_SHA"
          elif [ -n "$REQUESTED_SHA" ]; then
            CANDIDATE="$REQUESTED_SHA"
          else
            CANDIDATE="$DEFAULT_SHA"
          fi
          if ! [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Deploy SHA must be a full 40-character lowercase git SHA."
            exit 1
          fi
          echo "deploy_sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.deploy_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bizo-api:${{ steps.meta.outputs.deploy_sha }}
            ghcr.io/${{ github.repository_owner }}/bizo-api:sha-${{ steps.meta.outputs.deploy_sha }}
      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bizo-web:${{ steps.meta.outputs.deploy_sha }}
            ghcr.io/${{ github.repository_owner }}/bizo-web:sha-${{ steps.meta.outputs.deploy_sha }}

  migrate:
    name: Production migration
    needs: [publish-images]
    if:
      ${{ needs.publish-images.result == 'success' && inputs.skip_migrate != true &&
      inputs.rollback_to_sha == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-migration
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish-images.outputs.deploy_sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply production migrations once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @bizo/database prisma:migrate:deploy
      - name: Verify migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @bizo/database exec prisma migrate status

  validate-r2:
    name: Validate R2 infrastructure
    needs: [publish-images]
    if: ${{ needs.publish-images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish-images.outputs.deploy_sha }}
      - name: Detect R2 credentials
        id: r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "R2 credentials not fully configured; skipping probe."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Install pnpm
        if: ${{ steps.r2.outputs.configured == 'true' }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        if: ${{ steps.r2.outputs.configured == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install storage dependencies
        if: ${{ steps.r2.outputs.configured == 'true' }}
        run: pnpm install --frozen-lockfile --filter @bizo/storage...
      - name: Put/get/delete R2 probe object
        if: ${{ steps.r2.outputs.configured == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: pnpm --filter @bizo/storage validate:r2

  deploy:
    name: Deploy API and web
    needs: [publish-images, migrate, validate-r2]
    if:
      ${{ always() && needs.publish-images.result == 'success' && (needs.migrate.result == 'success'
      || needs.migrate.result == 'skipped') && (needs.validate-r2.result == 'success' ||
      needs.validate-r2.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish-images.outputs.deploy_sha }}
      - name: Require hosting credentials
        id: hosting
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          DEPLOY_SHA: ${{ needs.publish-images.outputs.deploy_sha }}
        run: |
          # Preflight already fails the run before any mutation when these are
          # absent. This guard exists so a green workflow can never mean
          # "published and migrated but not deployed". Fail loudly instead of
          # exiting 0 with a skipped rollout.
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_API_SERVICE_ID" ] || [ -z "$RENDER_WEB_SERVICE_ID" ]; then
            echo "::error::Hosting credentials are not configured for SHA ${DEPLOY_SHA}."
            echo "This run published images and may have migrated the database."
            echo "Treat the workflow as FAILED: configure RENDER_* secrets and re-run to complete the rollout."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Deploy API (git/Docker build)
        if: ${{ steps.hosting.outputs.configured == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
          DEPLOY_SHA: ${{ needs.publish-images.outputs.deploy_sha }}
        run: |
          # Free-tier services build from GitHub + Dockerfile paths (not private GHCR pulls).
          # Still publish GHCR images above for immutability / future image-backed cutover.
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_API_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${DEPLOY_SHA}\"}"
      - name: Deploy web (git/Docker build)
        if: ${{ steps.hosting.outputs.configured == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          DEPLOY_SHA: ${{ needs.publish-images.outputs.deploy_sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_WEB_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${DEPLOY_SHA}\"}"
      - name: Wait for API health
        if: ${{ steps.hosting.outputs.configured == 'true' }}
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          url="${API_HEALTH_URL:-https://api.bizos.qloudihub.com/api/v1/health}"
          # Free-tier cold starts + monorepo Docker builds can exceed 10 minutes.
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 30 "$url" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "API healthy"
              exit 0
            fi
            sleep 20
          done
          echo "API health check failed"
          exit 1
      - name: Wait for web health
        if: ${{ steps.hosting.outputs.configured == 'true' }}
        env:
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
        run: |
          url="${WEB_HEALTH_URL:-https://bizos.qloudihub.com/}"
          for attempt in {1..60}; do
            code=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Web healthy"
              exit 0
            fi
            sleep 20
          done
          echo "Web health check failed"
          exit 1
      - name: Record deployment summary
        env:
          DEPLOY_SHA: ${{ needs.publish-images.outputs.deploy_sha }}
          OWNER: ${{ github.repository_owner }}
          HOSTING_CONFIGURED: ${{ steps.hosting.outputs.configured }}
        run: |
          {
            echo "## Production deployment"
            echo "- Target SHA: \`${DEPLOY_SHA}\`"
            echo "- Deploy mode: Render git/Docker build (GHCR tags also published)"
            echo "- API image (artifact): \`ghcr.io/${OWNER}/bizo-api:${DEPLOY_SHA}\`"
            echo "- Web image (artifact): \`ghcr.io/${OWNER}/bizo-web:${DEPLOY_SHA}\`"
            if [ "$HOSTING_CONFIGURED" = "true" ]; then
              echo "- Hosting rollout: completed"
            else
              # Unreachable while preflight and the hosting guard fail the run;
              # kept defensive so a green summary can never claim otherwise.
              echo "- Hosting rollout: NOT completed (workflow failed)"
            fi
            echo "- Rollback: re-run this workflow with rollback_to_sha set to the prior SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-n8n:
    name: Notify n8n deploy result (optional)
    runs-on: ubuntu-24.04
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notify n8n
        env:
          N8N_CI_WEBHOOK_URL: ${{ secrets.N8N_CI_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_SHA: ${{ github.event.inputs.git_sha || github.sha }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            node scripts/ops/n8n-notify.mjs deploy-success \
              --sha "$DEPLOY_SHA" \
              --conclusion success
          else
            node scripts/ops/n8n-notify.mjs deploy-failure \
              --sha "$DEPLOY_SHA" \
              --conclusion "$DEPLOY_RESULT"
          fi
        continue-on-error: true
