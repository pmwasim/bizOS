name: Container builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Record build time
        id: build-meta
        # Computed here rather than taken from a webhook field: the API validates BUILD_TIME as an
        # ISO datetime at boot, so an empty or non-ISO value would stop the service starting.
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: bizo/${{ matrix.app }}:${{ github.sha }}
          # Baked into the image so /health can report what is actually deployed. Without this the
          # release-readiness gate can only say the site is up, not that it is running this commit.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-meta.outputs.time }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
