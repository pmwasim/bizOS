name: Production migrate

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Main or release-tag commit SHA whose migrations to apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Production migration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Resolve and authorize SHA
        id: meta
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          CANDIDATE="${REQUESTED_SHA:-$DEFAULT_SHA}"
          if ! [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA must be a full 40-character lowercase git SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "Refusing migration SHA that is not an ancestor of origin/main."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "v0.1.0-beta.1^{commit}" >/dev/null; then
            echo "Release tag lookup skipped; main ancestry gate already passed."
          fi
          echo "deploy_sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Check out authorized migration SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.deploy_sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply production migrations once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @bizo/database prisma:migrate:deploy
      - name: Verify migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @bizo/database exec prisma migrate status
