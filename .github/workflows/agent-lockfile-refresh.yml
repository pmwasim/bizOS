name: Agent lockfile refresh

on:
  push:
    branches:
      - agent/harden-payment-boundary
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/agent-lockfile-refresh.yml
  pull_request:
    branches:
      - main
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/agent-lockfile-refresh.yml

permissions:
  contents: write

concurrency:
  group: agent-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    # Temporary branch-only automation; remove after the lockfile commit lands.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'agent/harden-payment-boundary')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-payment-boundary
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Regenerate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): refresh lockfile for js-yaml advisory"
          git push origin HEAD:agent/harden-payment-boundary
