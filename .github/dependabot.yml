version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 10
    groups:
      nest:
        patterns: ["@nestjs/*"]
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      quality:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Riyadh

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    # The runtime image has to stay inside the engines range in package.json
    # (node >=22.13 <25). Only versions outside that range are ignored, so the
    # 22 -> 24 move is still proposed; a bump to 25 or later would produce a PR
    # that cannot pass CI.
    ignore:
      - dependency-name: node
        versions: [">=25"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    # Same engines constraint as the API image.
    ignore:
      - dependency-name: node
        versions: [">=25"]
