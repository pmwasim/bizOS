name: bizo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bizo
      POSTGRES_PASSWORD: bizo_local_only
      POSTGRES_USER: bizo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizo -d bizo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      # PostgreSQL 18+ stores versioned data below this parent mount.
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "$$REDIS_PASSWORD",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate a local Redis password}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.70.3
    container_name: bizos-n8n
    profiles: ["ops"]
    environment:
      DB_SQLITE_POOL_SIZE: "2"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE: "true"
      GENERIC_TIMEZONE: UTC
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-bizos-local-n8n-password}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-bizos-local-n8n-encryption-key-32b}
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_HOST: 127.0.0.1
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,http,https
      WEBHOOK_URL: http://127.0.0.1:5678/
      BIZOS_API_HEALTH_URL: ${BIZOS_API_HEALTH_URL:-https://api.bizos.qloudihub.com/api/v1/health}
      BIZOS_OPS_ALERT_EMAIL: ${BIZOS_OPS_ALERT_EMAIL:-ops@bizos.local}
      BIZOS_OPS_ALERT_FROM: ${SMTP_FROM:-n8n@bizos.local}
      BIZOS_OPS_ALERT_WEBHOOK_URL: ${BIZOS_OPS_ALERT_WEBHOOK_URL:-}
      BIZOS_OPS_MAILPIT_URL: http://mailpit:8025
      BIZOS_WEB_HEALTH_URL: ${BIZOS_WEB_HEALTH_URL:-https://bizos.qloudihub.com/}
      BIZOS_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${N8N_GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - mailpit
    mem_limit: 1g
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  n8n-data:
