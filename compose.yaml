name: bizo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bizo
      POSTGRES_PASSWORD: bizo_local_only
      POSTGRES_USER: bizo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizo -d bizo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      # PostgreSQL 18+ stores versioned data below this parent mount.
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
